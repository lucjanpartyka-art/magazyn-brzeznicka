<!doctype html><html lang="pl"><meta charset="utf-8"><title>Test odczytu nazwy</title><style>body{font:20px system-ui;margin:32px}button{padding:15px;font:inherit}img{max-width:500px;width:100%}</style><h1>Test odczytu nazwy na urządzeniu</h1><p>Rzeczywisty OCR obrazu na urządzeniu, bez AI i bez zapisu magazynowego.</p><img src="name-label.jpg"><p><button id="run">Uruchom test</button></p><p id="status" role="status"></p><p id="result"></p><script src="../photo-name.js"></script><script>
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run');button.disabled=true;const status=document.getElementById('status');const result=document.getElementById('result');const start=performance.now();try{const blob=await fetch('name-label.jpg').then(r=>r.blob());const image=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});const value=await PhotoName.recognize(image,recognizePhotoLocally,m=>status.textContent=m);result.textContent=value.name;status.textContent=/HERBATA ZIELONA/i.test(value.name)?'✓ Odczyt lokalny działa ('+Math.round((performance.now()-start)/1000)+' s)':'BŁĄD: brak oczekiwanego tekstu';}catch(e){status.textContent='BŁĄD: '+e.message}finally{button.disabled=false}};
</script></html>
